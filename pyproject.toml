[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
preview = true

[tool.isort]
profile = 'black'
multi_line_output = 3

[tool.uv.sources]
perspic = { workspace = true }

[project]
name = "perspic"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nngeometry==0.3.2",
    "opacus==1.5.4",
    "pandas>=3.0.5",
    "psutil==7.1.3",
    "pytorch-lightning==2.5.5",
    "setuptools==80.9.0",
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "perspic",
]
